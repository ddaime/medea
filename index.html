<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>განსაკუთრებული შეკითხვა</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #fdf2f2;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            text-align: center;
            overflow: hidden;
        }
        .card { background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 400px; width: 90%; }
        h1 { color: #b91c1c; font-size: 1.8rem; margin-bottom: 20px; }
        .btn-container { display: flex; justify-content: center; gap: 15px; margin-top: 20px; position: relative; min-height: 60px; }
        button { padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; transition: 0.3s; }
        #yesBtn { background-color: #ef4444; color: white; }
        #noBtn { background-color: #9ca3af; color: white; position: absolute; }
        img { width: 100%; border-radius: 15px; margin-bottom: 15px; }
        p { color: #4b5563; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <img id="stageImg" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHJueGZ3bmpxYm9pZzRreHpjY3RreHpjY3RreHpjY3RreHpjYyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/MDJ9IbxxvDUQM/giphy.gif">
        <h1 id="headline">გამარჯობა, მედეა ❤️</h1>
        <p id="subtext">ერთი წამით მოცლი? რაღაც უნდა გკითხო...</p>
        
        <div class="btn-container">
            <button id="yesBtn">რა ხდება?</button>
            <button id="noBtn">არა, დაკავებული ვარ</button>
        </div>
    </div>

    <script>
        const stages = [
            {
                headline: "იცი რა დღე მოდის? 😊",
                subtext: "კალენდარში 14 თებერვალი მიჩვენებს, რომ რაღაც ძალიან მნიშვნელოვანია დაგეგმილი...",
                btnText: "რა არის?",
                img: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp1eHByZzR0bm93dzR5eXp6ZzR5eXp6ZzR5eXp6ZzR5eXp6ZzR5JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/KZTv7vL2cRE0G8x301/giphy.gif"
            },
            {
                headline: "გახდები ჩემი ვალენტინი? ❤️",
                subtext: "8000 ვინტაჟში საუკეთესო ღვინოს შევარჩევ და საღამოს ერთად გავატარებთ...",
                btnText: "კი, სიამოვნებით!",
                img: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp1eHByZzR0bm93dzR5eXp6ZzR5eXp6ZzR5eXp6ZzR5eXp6ZzR5JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/l0HlSshT8P7L86v5K/giphy.gif"
            }
        ];

        let currentStage = 0;
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const headline = document.getElementById('headline');
        const subtext = document.getElementById('subtext');
        const stageImg = document.getElementById('stageImg');
        let yesScale = 1;

        noBtn.addEventListener('mouseover', () => {
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
            
            yesScale += 0.15;
            yesBtn.style.transform = `scale(${yesScale})`;
        });

        yesBtn.addEventListener('click', () => {
            if (currentStage < stages.length) {
                const stage = stages[currentStage];
                headline.innerText = stage.headline;
                subtext.innerText = stage.subtext;
                yesBtn.innerText = stage.btnText;
                stageImg.src = stage.img;
                
                // Reset "No" button position and Yes scale for the next question
                noBtn.style.position = 'absolute';
                noBtn.style.left = 'auto';
                noBtn.style.top = 'auto';
                yesScale = 1;
                yesBtn.style.transform = `scale(1)`;
                
                currentStage++;
            } else {
                document.getElementById('mainCard').innerHTML = `
                    <h1>შევთანხმდით! 🥰</h1>
                    <p>ლოკაცია: 8000 ვინტაჟი 🍷</p>
                    <p>დრო: 14 თებერვალი</p>
                    <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp1eHByZzR0bm93dzR5eXp6ZzR5eXp6ZzR5eXp6ZzR5eXp6ZzR5JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/KZTv7vL2cRE0G8x301/giphy.gif">
                    <p style="font-size: 0.8rem; color: gray;">// commit -m "relationship updated"</p>
                `;
            }
        });
    </script>
</body>
</html>
